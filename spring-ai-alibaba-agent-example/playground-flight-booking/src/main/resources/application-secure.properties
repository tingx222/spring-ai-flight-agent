# Activate mysql,secure for the complete application.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.data.redis.host=${REDIS_HOST:192.168.64.129}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
app.auth.session-store=redis
app.auth.bootstrap-admin-username=${ADMIN_USERNAME:admin}
app.auth.bootstrap-admin-password=${ADMIN_PASSWORD:}
app.auth.cookie-secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
